# Gateway routing table and limits.  Copy to /tmp/gateway.conf on the Pi (optional:
# if the file is missing the Gateway uses these same values built in).
#
# route <can-id> <class> <action> <max-frames-per-second, 0 = unlimited>
#   class : safety | telemetry | diag | heartbeat   (decides queue, thread and egress channel)
#   action: forward = process and send out | consume = process locally only | drop = always block
# Any ID that is NOT listed here is blocked (allowlist, default deny).
route 0x100 safety    forward 0
route 0x300 telemetry forward 0
route 0x700 diag      forward 3000
route 0x7FF heartbeat consume 0

# Plausibility limits for telemetry (frames above these are blocked)
limit speed_max 300      # km/h
limit rpm_max   8000     # rpm
limit temp_max  1500     # coolant temp x10 C (1500 = 150.0 C)
